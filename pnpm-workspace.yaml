allowBuilds:
  '@parcel/watcher': false
  '@tailwindcss/oxide': false
  esbuild: false
  maplibre-gl: false
  simple-git-hooks: true
  unrs-resolver: false
  vue-demi: false

# Delay new releases long enough for ecosystem and registry signals to emerge.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Exact, reviewable exceptions already present in this lockfile.
  - ip-address@10.7.0
  - qs@6.16.0
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeStrict: true

# Keep dependency resolution and lifecycle scripts within the declared supply chain.
blockExoticSubdeps: true
strictDepBuilds: true
verifyDepsBeforeRun: error
verifyStoreIntegrity: true

audit:
  # extract-zip has no patched npm release; exposure is limited to Lighthouse's
  # development-only browser installer, while CI uses an already-installed browser.
  ignore:
    - GHSA-jmr9-qjv8-65gv

# Compatibility for pnpm releases predating the audit.ignore setting.
auditConfig:
  ignoreGhsas:
    - GHSA-jmr9-qjv8-65gv

overrides:
  '@tiptap/core@3.24.0': 3.30.4
  brace-expansion@2.1.0: 2.1.4
