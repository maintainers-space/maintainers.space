name: labeler

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  label:
    name: 🏷️ Label PR
    if: github.repository == 'maintainers-space/maintainers.space'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # for actions/labeler to add and remove PR labels
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
