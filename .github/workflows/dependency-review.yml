name: Dependency review

on:
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  dependency-review:
    name: 📦 Dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
          license-check: true
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
          # No patched extract-zip release exists; it is only used by Lighthouse's
          # development browser installer, while CI installs Chromium separately.
          allow-ghsas: GHSA-jmr9-qjv8-65gv

      - name: Confirm queued dependency review
        if: github.event_name == 'merge_group'
        run: echo "Dependency changes passed review before entering the merge queue."
