name: CodeQL

on:
  pull_request:
    branches:
      - main
      - release
  push:
    branches:
      - main
      - release
  merge_group:
    branches:
      - main
      - release
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    name: 🔎 CodeQL JavaScript and TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload CodeQL results

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4

      - name: Require a clean CodeQL analysis
        env:
          SARIF_DIRECTORY: ${{ steps.analyze.outputs.sarif-output }}
        run: |
          jq --slurp --exit-status '
            [
              .[].runs[]?
              | . as $run
              | .results[]?
              | select(
                  $run.tool.driver.rules[.ruleIndex].properties.kind
                  | IN("problem", "path-problem")
                )
            ]
            | length == 0
          ' "$SARIF_DIRECTORY"/*.sarif
