name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  version:
    name: 🚀 Prepare release
    if: github.repository == 'maintainers-space/maintainers.space'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the signed release commit and update its branch
      pull-requests: write # create or update the manually approved release PR

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update release pull request
        id: release
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm run release:version
          commit-message: 'chore: version release'
          pr-title: 'chore: release next version'
          pr-base-branch: main
          create-github-releases: false
          push-git-tags: false

      - name: Set semantic release title
        if: steps.release.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.release.outputs.pr-number }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh pr edit "$PR_NUMBER" --title "chore: release v${VERSION}"
